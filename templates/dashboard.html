<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Avito Parser</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 0;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            color: #fff;
        }

        .header a {
            color: #4a9eff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .header a:hover {
            color: #3a8eef;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 12px;
            align-items: end;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-field label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-field select {
            padding: 10px 14px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            min-width: 180px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .filter-field select:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .mode-toggle {
            display: flex;
            gap: 0;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .mode-btn {
            padding: 10px 16px;
            background: #0f0f0f;
            border: none;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }

        .mode-btn:not(:last-child) {
            border-right: 1px solid #333;
        }

        .mode-btn:hover {
            color: #fff;
            background: #1a1a1a;
        }

        .mode-btn.active {
            background: #4a9eff;
            color: #fff;
        }

        .filter-stats {
            margin-left: auto;
            font-size: 13px;
            color: #888;
            align-self: center;
        }

        .filter-stats strong {
            color: #fff;
        }

        /* Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        /* Flip Card */
        .flip-card {
            perspective: 800px;
            height: 220px;
            cursor: pointer;
        }

        .flip-card__inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card:hover .flip-card__inner {
            transform: rotateY(180deg);
        }

        .flip-card__front,
        .flip-card__back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .flip-card:hover .flip-card__front,
        .flip-card:hover .flip-card__back {
            border-color: #3a3a3a;
        }

        .flip-card__front {
            background: #1a1a1a;
        }

        .flip-card__back {
            background: #1e1e1e;
            transform: rotateY(180deg);
        }

        .flip-card__title {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .flip-card__price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .flip-card__price {
            font-size: 20px;
            font-weight: 700;
            color: #f87171;
        }

        .flip-card__resale {
            font-size: 14px;
            color: #4ade80;
            font-weight: 600;
        }

        .flip-card__roi {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            width: fit-content;
            margin-top: auto;
        }

        .flip-card__roi--high {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }

        .flip-card__roi--medium {
            background: rgba(250, 204, 21, 0.15);
            color: #facc15;
        }

        .flip-card__roi--low {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        .flip-card__condition {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }

        /* Back side */
        .flip-card__back-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .flip-card__detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
        }

        .flip-card__detail-row:last-of-type {
            border-bottom: none;
        }

        .flip-card__detail-label {
            color: #888;
        }

        .flip-card__detail-value {
            color: #fff;
            font-weight: 600;
        }

        .flip-card__flags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 12px;
        }

        .flip-card__flag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border-radius: 4px;
            font-size: 11px;
        }

        .flip-card__link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: auto;
            padding: 8px 16px;
            background: #4a9eff;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .flip-card__link:hover {
            background: #3a8eef;
        }

        /* Loading Skeleton */
        .loading-skeleton {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .skeleton-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            height: 220px;
            display: flex;
            flex-direction: column;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #2a2a2a 25%, #333 50%, #2a2a2a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .skeleton-line--title {
            width: 85%;
        }

        .skeleton-line--short {
            width: 50%;
        }

        .skeleton-line--price {
            width: 40%;
            height: 24px;
            margin-top: 16px;
        }

        .skeleton-line--badge {
            width: 60px;
            height: 28px;
            margin-top: auto;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #555;
        }

        .empty-state__icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .empty-state__title {
            font-size: 18px;
            color: #888;
            margin-bottom: 8px;
        }

        .empty-state__text {
            font-size: 14px;
            color: #555;
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }

        .error-state__icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-state__title {
            font-size: 16px;
            color: #f87171;
            margin-bottom: 8px;
        }

        .error-state__text {
            font-size: 14px;
            color: #888;
        }

        .error-state__retry {
            margin-top: 16px;
            padding: 10px 24px;
            background: #4a9eff;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .error-state__retry:hover {
            background: #3a8eef;
        }

        /* Query Input */
        .filter-field input[type="text"] {
            padding: 10px 14px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            min-width: 200px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .filter-field input[type="text"]:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .filter-field input[type="text"]::placeholder {
            color: #555;
        }

        /* Charts Section */
        .charts-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-container {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            min-height: 280px;
            transition: border-color 0.3s;
        }

        .chart-container:hover {
            border-color: #3a3a3a;
        }

        .chart-container__title {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .chart-container__canvas-wrap {
            position: relative;
            width: 100%;
            height: 220px;
        }

        .chart-container__canvas-wrap canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .chart-skeleton {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 36px;
        }

        .chart-skeleton__bar {
            height: 14px;
            background: linear-gradient(90deg, #2a2a2a 25%, #333 50%, #2a2a2a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        .chart-skeleton__bar:nth-child(1) { width: 90%; }
        .chart-skeleton__bar:nth-child(2) { width: 70%; }
        .chart-skeleton__bar:nth-child(3) { width: 80%; }
        .chart-skeleton__bar:nth-child(4) { width: 55%; }
        .chart-skeleton__bar:nth-child(5) { width: 65%; }
        .chart-skeleton__bar:nth-child(6) { width: 45%; }

        .chart-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 13px;
            padding-top: 36px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .card-grid,
            .loading-skeleton {
                grid-template-columns: repeat(2, 1fr);
            }

            .charts-section {
                grid-template-columns: 1fr 1fr;
            }

            .charts-section .chart-container:last-child {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 640px) {
            .card-grid,
            .loading-skeleton {
                grid-template-columns: 1fr;
            }

            .charts-section {
                grid-template-columns: 1fr;
            }

            .charts-section .chart-container:last-child {
                grid-column: auto;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-field select {
                min-width: unset;
                width: 100%;
            }

            .filter-field input[type="text"] {
                min-width: unset;
                width: 100%;
            }

            .mode-toggle {
                width: 100%;
            }

            .mode-btn {
                flex: 1;
                text-align: center;
            }

            .filter-stats {
                margin-left: 0;
                text-align: center;
            }

            .header {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Flip Dashboard</h1>
            <a href="/">&#8592; На главную</a>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
            <div class="filter-field">
                <label>Поиск</label>
                <input type="text" id="queryInput" value="iPhone" placeholder="Например: iPhone">
            </div>

            <div class="filter-field">
                <label>Город</label>
                <select id="cityFilter">
                    <option value="">Все города</option>
                    <option value="moskva">Москва</option>
                    <option value="moskva_i_mo">Москва и МО</option>
                    <option value="sankt-peterburg">Санкт-Петербург</option>
                    <option value="novosibirsk">Новосибирск</option>
                    <option value="ekaterinburg">Екатеринбург</option>
                    <option value="kazan">Казань</option>
                    <option value="krasnodar">Краснодар</option>
                    <option value="rostov-na-donu">Ростов-на-Дону</option>
                    <option value="tver">Тверь</option>
                    <option value="tula">Тула</option>
                    <option value="vladimir">Владимир</option>
                    <option value="kaluga">Калуга</option>
                    <option value="ryazan">Рязань</option>
                    <option value="yaroslavl">Ярославль</option>
                    <option value="smolensk">Смоленск</option>
                    <option value="bryansk">Брянск</option>
                    <option value="ivanovo">Иваново</option>
                    <option value="kostroma">Кострома</option>
                    <option value="tambov">Тамбов</option>
                    <option value="voronezh">Воронеж</option>
                    <option value="lipetsk">Липецк</option>
                    <option value="orel">Орёл</option>
                    <option value="kursk">Курск</option>
                    <option value="rossiya">Вся Россия</option>
                </select>
            </div>

            <div class="filter-field">
                <label>Тип</label>
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" data-mode="all">Все</button>
                    <button class="mode-btn" data-mode="quick">&#9889; Quick</button>
                    <button class="mode-btn" data-mode="deep">&#128176; Deep</button>
                </div>
            </div>

            <div class="filter-stats" id="filterStats"></div>
        </div>

        <!-- Charts -->
        <div class="charts-section" id="chartsSection">
            <div class="chart-container" id="trendChartBox">
                <div class="chart-container__title">Динамика цен (7 дней)</div>
                <div class="chart-container__canvas-wrap">
                    <canvas id="trendChart"></canvas>
                    <div class="chart-skeleton" id="trendSkeleton">
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                    </div>
                </div>
            </div>
            <div class="chart-container" id="regionChartBox">
                <div class="chart-container__title">Сравнение по регионам</div>
                <div class="chart-container__canvas-wrap">
                    <canvas id="regionChart"></canvas>
                    <div class="chart-skeleton" id="regionSkeleton">
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                    </div>
                </div>
            </div>
            <div class="chart-container" id="profitChartBox">
                <div class="chart-container__title">Распределение ROI (%)</div>
                <div class="chart-container__canvas-wrap">
                    <canvas id="profitChart"></canvas>
                    <div class="chart-skeleton" id="profitSkeleton">
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                        <div class="chart-skeleton__bar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div id="content">
            <!-- Loading skeleton (shown initially) -->
            <div class="loading-skeleton" id="skeleton">
                <div class="skeleton-card">
                    <div class="skeleton-line skeleton-line--title"></div>
                    <div class="skeleton-line skeleton-line--short"></div>
                    <div class="skeleton-line skeleton-line--price"></div>
                    <div class="skeleton-line skeleton-line--badge"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line skeleton-line--title"></div>
                    <div class="skeleton-line skeleton-line--short"></div>
                    <div class="skeleton-line skeleton-line--price"></div>
                    <div class="skeleton-line skeleton-line--badge"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line skeleton-line--title"></div>
                    <div class="skeleton-line skeleton-line--short"></div>
                    <div class="skeleton-line skeleton-line--price"></div>
                    <div class="skeleton-line skeleton-line--badge"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line skeleton-line--title"></div>
                    <div class="skeleton-line skeleton-line--short"></div>
                    <div class="skeleton-line skeleton-line--price"></div>
                    <div class="skeleton-line skeleton-line--badge"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line skeleton-line--title"></div>
                    <div class="skeleton-line skeleton-line--short"></div>
                    <div class="skeleton-line skeleton-line--price"></div>
                    <div class="skeleton-line skeleton-line--badge"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line skeleton-line--title"></div>
                    <div class="skeleton-line skeleton-line--short"></div>
                    <div class="skeleton-line skeleton-line--price"></div>
                    <div class="skeleton-line skeleton-line--badge"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FLAG_NAMES = {
            new_account: "Новый аккаунт",
            low_rating: "Низкий рейтинг",
            no_photos: "Без фото",
            bulk_seller: "Оптовик",
            suspicious_price: "Подозрительная цена",
            keyword_urgent: "Срочная продажа",
            keyword_damaged: "Повреждён",
            keyword_no_docs: "Без документов",
            keyword_parts: "На запчасти"
        };

        let currentCity = "";
        let currentMode = "all";
        let currentQuery = "iPhone";
        let abortController = null;
        let trendChartInstance = null;
        let regionChartInstance = null;
        let profitChartInstance = null;
        let queryDebounceTimer = null;

        function formatPrice(n) {
            if (n == null) return "—";
            return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " \u20BD";
        }

        function truncate(str, max) {
            if (!str) return "";
            return str.length > max ? str.slice(0, max) + "..." : str;
        }

        function roiClass(roi) {
            if (roi >= 20) return "flip-card__roi--high";
            if (roi >= 10) return "flip-card__roi--medium";
            return "flip-card__roi--low";
        }

        function renderFlags(flags) {
            if (!flags || !flags.length) return "";
            return flags.map(function(f) {
                var name = FLAG_NAMES[f] || f;
                return '<span class="flip-card__flag">\u26A0 ' + name + "</span>";
            }).join("");
        }

        function renderCard(c) {
            var roi = c.roi_percent != null ? c.roi_percent : 0;
            var flagsHtml = renderFlags(c.red_flags);
            var condition = c.condition || "";

            return '<div class="flip-card">' +
                '<div class="flip-card__inner">' +
                    '<div class="flip-card__front">' +
                        (condition ? '<div class="flip-card__condition">' + condition + "</div>" : "") +
                        '<div class="flip-card__title">' + truncate(c.title, 60) + "</div>" +
                        '<div class="flip-card__price-row">' +
                            '<span class="flip-card__price">' + formatPrice(c.buy_price) + "</span>" +
                            '<span class="flip-card__resale">' + formatPrice(c.estimated_resale) + "</span>" +
                        "</div>" +
                        '<div class="flip-card__roi ' + roiClass(roi) + '">ROI ' + roi + "%</div>" +
                    "</div>" +
                    '<div class="flip-card__back">' +
                        '<div class="flip-card__back-title">Детали сделки</div>' +
                        '<div class="flip-card__detail-row">' +
                            '<span class="flip-card__detail-label">Выкуп</span>' +
                            '<span class="flip-card__detail-value" style="color:#f87171">' + formatPrice(c.buy_price) + "</span>" +
                        "</div>" +
                        '<div class="flip-card__detail-row">' +
                            '<span class="flip-card__detail-label">Продажа</span>' +
                            '<span class="flip-card__detail-value" style="color:#4ade80">' + formatPrice(c.estimated_resale) + "</span>" +
                        "</div>" +
                        (flagsHtml ? '<div class="flip-card__flags">' + flagsHtml + "</div>" : "") +
                        (c.url ? '<a href="' + c.url + '" target="_blank" rel="noopener" class="flip-card__link">Открыть на Авито</a>' : "") +
                    "</div>" +
                "</div>" +
            "</div>";
        }

        function renderGrid(candidates) {
            if (!candidates || !candidates.length) {
                return '<div class="empty-state">' +
                    '<div class="empty-state__icon">\uD83D\uDD0D</div>' +
                    '<div class="empty-state__title">Нет подходящих результатов</div>' +
                    '<div class="empty-state__text">Попробуйте другой город или режим фильтрации</div>' +
                "</div>";
            }
            return '<div class="card-grid">' +
                candidates.map(renderCard).join("") +
            "</div>";
        }

        function renderError(msg) {
            return '<div class="error-state">' +
                '<div class="error-state__icon">\u26A0\uFE0F</div>' +
                '<div class="error-state__title">Ошибка загрузки</div>' +
                '<div class="error-state__text">' + (msg || "Не удалось загрузить данные") + "</div>" +
                '<button class="error-state__retry" onclick="fetchData()">Повторить</button>' +
            "</div>";
        }

        function showSkeleton() {
            document.getElementById("content").innerHTML =
                '<div class="loading-skeleton" id="skeleton">' +
                    Array(6).fill(
                        '<div class="skeleton-card">' +
                            '<div class="skeleton-line skeleton-line--title"></div>' +
                            '<div class="skeleton-line skeleton-line--short"></div>' +
                            '<div class="skeleton-line skeleton-line--price"></div>' +
                            '<div class="skeleton-line skeleton-line--badge"></div>' +
                        "</div>"
                    ).join("") +
                "</div>";
        }

        function updateStats(count) {
            var el = document.getElementById("filterStats");
            if (count != null) {
                el.innerHTML = "Найдено: <strong>" + count + "</strong>";
            } else {
                el.textContent = "";
            }
        }

        function fetchData() {
            if (abortController) abortController.abort();
            abortController = new AbortController();

            showSkeleton();

            var params = new URLSearchParams();
            if (currentCity) params.set("city", currentCity);
            params.set("mode", currentMode);

            fetch("/api/dashboard/flips?" + params.toString(), {
                signal: abortController.signal
            })
            .then(function(r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
            })
            .then(function(data) {
                var candidates = data.candidates || [];
                updateStats(candidates.length);
                document.getElementById("content").innerHTML = renderGrid(candidates);
                updateProfitHistogram(candidates);
            })
            .catch(function(err) {
                if (err.name === "AbortError") return;
                updateStats(null);
                document.getElementById("content").innerHTML = renderError(err.message);
            });
        }

        // Chart.js dark theme defaults
        Chart.defaults.color = "#aaa";
        Chart.defaults.borderColor = "#2a2a2a";
        Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

        function showChartSkeleton(id) {
            var el = document.getElementById(id);
            if (el) el.style.display = "flex";
        }

        function hideChartSkeleton(id) {
            var el = document.getElementById(id);
            if (el) el.style.display = "none";
        }

        function showChartEmpty(canvasId, skeletonId) {
            hideChartSkeleton(skeletonId);
            var wrap = document.getElementById(canvasId).parentNode;
            var existing = wrap.querySelector(".chart-empty");
            if (!existing) {
                var div = document.createElement("div");
                div.className = "chart-empty";
                div.textContent = "Нет данных для графиков";
                wrap.appendChild(div);
            }
        }

        function clearChartEmpty(canvasId) {
            var wrap = document.getElementById(canvasId).parentNode;
            var el = wrap.querySelector(".chart-empty");
            if (el) el.remove();
        }

        function getChartCity() {
            return currentCity || "moskva";
        }

        function loadTrends() {
            showChartSkeleton("trendSkeleton");
            clearChartEmpty("trendChart");

            var params = new URLSearchParams();
            params.set("query", currentQuery);
            params.set("city", getChartCity());
            params.set("days", "7");

            fetch("/api/trends?" + params.toString())
                .then(function(r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then(function(data) {
                    hideChartSkeleton("trendSkeleton");
                    var labels = data.labels || [];
                    var values = data.prices || [];
                    if (!labels.length || !values.length) {
                        if (trendChartInstance) { trendChartInstance.destroy(); trendChartInstance = null; }
                        showChartEmpty("trendChart", "trendSkeleton");
                        return;
                    }

                    if (trendChartInstance) trendChartInstance.destroy();
                    trendChartInstance = new Chart(document.getElementById("trendChart"), {
                        type: "line",
                        data: {
                            labels: labels,
                            datasets: [{
                                label: "Средняя цена",
                                data: values,
                                borderColor: "#4a9eff",
                                backgroundColor: "rgba(74, 158, 255, 0.1)",
                                fill: true,
                                tension: 0.3,
                                pointRadius: 4,
                                pointBackgroundColor: "#4a9eff",
                                pointBorderColor: "#1a1a1a",
                                pointBorderWidth: 2,
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: "#1a1a1a",
                                    borderColor: "#333",
                                    borderWidth: 1,
                                    titleColor: "#fff",
                                    bodyColor: "#ccc",
                                    callbacks: {
                                        label: function(ctx) { return formatPrice(ctx.parsed.y); }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    grid: { color: "#2a2a2a" },
                                    ticks: { color: "#888", font: { size: 11 } }
                                },
                                y: {
                                    grid: { color: "#2a2a2a" },
                                    ticks: {
                                        color: "#888",
                                        font: { size: 11 },
                                        callback: function(v) { return (v / 1000).toFixed(0) + "k"; }
                                    }
                                }
                            }
                        }
                    });
                })
                .catch(function() {
                    hideChartSkeleton("trendSkeleton");
                    if (trendChartInstance) { trendChartInstance.destroy(); trendChartInstance = null; }
                    showChartEmpty("trendChart", "trendSkeleton");
                });
        }

        function loadMultiRegion() {
            showChartSkeleton("regionSkeleton");
            clearChartEmpty("regionChart");

            var cities = ["moskva", "tula", "tver"];
            if (currentCity && cities.indexOf(currentCity) === -1) {
                cities = [currentCity, "moskva", "tula"];
            }

            var params = new URLSearchParams();
            params.set("cities", cities.join(","));
            params.set("query", currentQuery);

            fetch("/api/flips/multi?" + params.toString())
                .then(function(r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then(function(data) {
                    hideChartSkeleton("regionSkeleton");
                    var regions = Array.isArray(data) ? data : (data.regions || data.cities || data.results || []);
                    if (!regions.length) {
                        if (regionChartInstance) { regionChartInstance.destroy(); regionChartInstance = null; }
                        showChartEmpty("regionChart", "regionSkeleton");
                        return;
                    }

                    var CITY_NAMES = {
                        moskva: "Москва", "sankt-peterburg": "СПб", novosibirsk: "Новосибирск",
                        ekaterinburg: "Екатеринбург", kazan: "Казань", krasnodar: "Краснодар",
                        tver: "Тверь", tula: "Тула", vladimir: "Владимир", kaluga: "Калуга",
                        ryazan: "Рязань", yaroslavl: "Ярославль", smolensk: "Смоленск",
                        bryansk: "Брянск", ivanovo: "Иваново", kostroma: "Кострома",
                        tambov: "Тамбов", voronezh: "Воронеж", lipetsk: "Липецк",
                        orel: "Орёл", kursk: "Курск", "rostov-na-donu": "Ростов-на-Дону"
                    };

                    var labels = regions.map(function(r) {
                        var key = r.city || r.region || r.name || "";
                        return CITY_NAMES[key] || key;
                    });
                    var medianPrices = regions.map(function(r) { return r.median_price || 0; });
                    var candidateCounts = regions.map(function(r) {
                        return Array.isArray(r.candidates) ? r.candidates.length : 0;
                    });

                    if (regionChartInstance) regionChartInstance.destroy();
                    regionChartInstance = new Chart(document.getElementById("regionChart"), {
                        type: "bar",
                        data: {
                            labels: labels,
                            datasets: [{
                                label: "Медианная цена",
                                data: medianPrices,
                                backgroundColor: "rgba(74, 158, 255, 0.7)",
                                borderColor: "#4a9eff",
                                borderWidth: 1,
                                borderRadius: 4
                            }, {
                                label: "Кол-во объявлений",
                                data: candidateCounts,
                                backgroundColor: "rgba(74, 222, 128, 0.7)",
                                borderColor: "#4ade80",
                                borderWidth: 1,
                                borderRadius: 4,
                                yAxisID: "y1"
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: "bottom",
                                    labels: { color: "#888", font: { size: 11 }, boxWidth: 12, padding: 12 }
                                },
                                tooltip: {
                                    backgroundColor: "#1a1a1a",
                                    borderColor: "#333",
                                    borderWidth: 1,
                                    titleColor: "#fff",
                                    bodyColor: "#ccc"
                                }
                            },
                            scales: {
                                x: {
                                    grid: { color: "#2a2a2a" },
                                    ticks: { color: "#888", font: { size: 11 } }
                                },
                                y: {
                                    position: "left",
                                    grid: { color: "#2a2a2a" },
                                    ticks: {
                                        color: "#888",
                                        font: { size: 11 },
                                        callback: function(v) { return (v / 1000).toFixed(0) + "k"; }
                                    }
                                },
                                y1: {
                                    position: "right",
                                    grid: { display: false },
                                    ticks: { color: "#4ade80", font: { size: 11 } }
                                }
                            }
                        }
                    });
                })
                .catch(function() {
                    hideChartSkeleton("regionSkeleton");
                    if (regionChartInstance) { regionChartInstance.destroy(); regionChartInstance = null; }
                    showChartEmpty("regionChart", "regionSkeleton");
                });
        }

        function updateProfitHistogram(candidates) {
            hideChartSkeleton("profitSkeleton");
            clearChartEmpty("profitChart");

            var rois = (candidates || []).map(function(c) { return c.roi_percent; }).filter(function(v) { return v != null; });

            if (!rois.length) {
                if (profitChartInstance) { profitChartInstance.destroy(); profitChartInstance = null; }
                showChartEmpty("profitChart", "profitSkeleton");
                return;
            }

            var bins = [
                { label: "0-5%", min: 0, max: 5 },
                { label: "5-10%", min: 5, max: 10 },
                { label: "10-20%", min: 10, max: 20 },
                { label: "20-30%", min: 20, max: 30 },
                { label: "30-50%", min: 30, max: 50 },
                { label: "50%+", min: 50, max: Infinity }
            ];

            var counts = bins.map(function(b) {
                return rois.filter(function(r) { return r >= b.min && r < b.max; }).length;
            });

            var colors = bins.map(function(b) {
                if (b.min >= 20) return "rgba(74, 222, 128, 0.7)";
                if (b.min >= 10) return "rgba(250, 204, 21, 0.7)";
                return "rgba(248, 113, 113, 0.7)";
            });

            if (profitChartInstance) profitChartInstance.destroy();
            profitChartInstance = new Chart(document.getElementById("profitChart"), {
                type: "bar",
                data: {
                    labels: bins.map(function(b) { return b.label; }),
                    datasets: [{
                        label: "Кол-во флипов",
                        data: counts,
                        backgroundColor: colors,
                        borderRadius: 4,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: "#1a1a1a",
                            borderColor: "#333",
                            borderWidth: 1,
                            titleColor: "#fff",
                            bodyColor: "#ccc"
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: "#2a2a2a" },
                            ticks: { color: "#888", font: { size: 11 } }
                        },
                        y: {
                            grid: { color: "#2a2a2a" },
                            ticks: {
                                color: "#888",
                                font: { size: 11 },
                                stepSize: 1
                            },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function loadAllCharts() {
            loadTrends();
            loadMultiRegion();
        }

        // City filter
        document.getElementById("cityFilter").addEventListener("change", function(e) {
            currentCity = e.target.value;
            fetchData();
            loadAllCharts();
        });

        // Mode toggle
        document.getElementById("modeToggle").addEventListener("click", function(e) {
            var btn = e.target.closest(".mode-btn");
            if (!btn) return;
            this.querySelectorAll(".mode-btn").forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            currentMode = btn.dataset.mode;
            fetchData();
        });

        // Initial load
        fetchData();
        loadAllCharts();

        // Query input with debounce
        document.getElementById("queryInput").addEventListener("input", function(e) {
            clearTimeout(queryDebounceTimer);
            queryDebounceTimer = setTimeout(function() {
                currentQuery = e.target.value.trim() || "iPhone";
                loadAllCharts();
            }, 500);
        });
    </script>
</body>
</html>
